name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [review_requested]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable project-pinned Yarn
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile
      - name: Run Jest tests
        run: yarn test:ci --runInBand
      - name: Type check
        run: yarn tsc --noEmit
      - name: Lint
        run: yarn lint
