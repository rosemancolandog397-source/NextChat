name: Remove trusted preview

# Metadata-only processing: never checkout PR code or execute repository scripts.
on:
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: trusted-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delete-deployments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Remove only this repository and PR's preview deployments
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        with:
          script: |
            const { VERCEL_TOKEN: token, VERCEL_ORG_ID: teamId,
              VERCEL_PROJECT_ID: projectId } = process.env;
            if (!token || !teamId || !projectId) {
              core.notice('Vercel credentials are not configured; cleanup skipped.');
              return;
            }
            const prNumber = context.payload.pull_request.number;
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              throw new Error('Invalid PR number; cleanup stopped.');
            }
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const request = async (url, method = 'GET') => {
              const response = await fetch(url, {
                method,
                headers: { Authorization: `Bearer ${token}` },
                redirect: 'error',
                signal: AbortSignal.timeout(30000),
              });
              if (method === 'DELETE' && response.status === 404) return null;
              if (!response.ok) throw new Error(`Vercel API HTTP ${response.status}`);
              return method === 'GET' ? response.json() : null;
            };
            let cursor;
            let removed = 0;
            for (let page = 0; page < 100; page++) {
              const url = new URL('https://api.vercel.com/v6/deployments');
              url.search = new URLSearchParams({ projectId, teamId, limit: '100',
                ...(cursor === undefined ? {} : { until: String(cursor) }) });
              const data = await request(url);
              if (!Array.isArray(data.deployments)) {
                throw new Error('Unexpected Vercel response; cleanup stopped.');
              }
              for (const deployment of data.deployments) {
                const meta = deployment.meta ?? {};
                if ((deployment.target != null && deployment.target !== 'preview') ||
                    meta.preview_source !== 'trusted-default-branch' ||
                    meta.preview_repository !== repository ||
                    meta.preview_pr !== String(prNumber)) continue;
                if (typeof deployment.uid !== 'string' ||
                    !/^dpl_[a-zA-Z0-9]+$/.test(deployment.uid)) {
                  throw new Error('Invalid deployment ID; cleanup stopped.');
                }
                const remove = new URL(`https://api.vercel.com/v13/deployments/${deployment.uid}`);
                remove.search = new URLSearchParams({ teamId });
                await request(remove, 'DELETE');
                removed++;
              }
              const next = data.pagination?.next;
              if (next === null || next === undefined) break;
              if (!Number.isSafeInteger(next) || next < 0 ||
                  (cursor !== undefined && next >= cursor) || page === 99) {
                throw new Error('Invalid or excessive pagination; cleanup stopped.');
              }
              cursor = next;
            }
            core.info(`Removed ${removed} matching preview deployment(s).`);
