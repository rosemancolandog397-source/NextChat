name: Trusted default-branch preview

# Do not build PR code in a workflow that can access deployment credentials.
# Maintainers may publish the trusted default branch as a clearly labelled demo.
on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open PR to receive a default-branch demo link (not a PR build)"
        required: true
        type: string

permissions: {}

concurrency:
  group: trusted-preview-${{ github.repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate target PR
        id: validate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
        with:
          script: |
            const value = process.env.PR_NUMBER;
            if (!/^[1-9]\d*$/.test(value) || !Number.isSafeInteger(Number(value))) {
              throw new Error('A positive PR number is required.');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(value),
            });
            if (pr.state !== 'open') throw new Error('The PR must still be open.');
            core.setOutput('pr_number', value);

      - name: Checkout trusted workflow commit only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install fixed Vercel CLI version
        run: npm install --global vercel@65.2.0 --ignore-scripts

      - name: Build and deploy trusted default-branch demo
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
          PREVIEW_REPOSITORY: ${{ github.repository }}
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN}"
          : "${VERCEL_ORG_ID:?Missing VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?Missing VERCEL_PROJECT_ID}"
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --archive=tgz --target=preview \
            --token="$VERCEL_TOKEN" \
            --meta "preview_repository=$PREVIEW_REPOSITORY" \
            --meta "preview_pr=$PR_NUMBER" \
            --meta "preview_source=trusted-default-branch" \
            --meta "preview_sha=$PREVIEW_SHA" > "$RUNNER_TEMP/trusted-preview-url.txt"

      - name: Post labelled demo link
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const url = fs.readFileSync(path.join(process.env.RUNNER_TEMP,
              'trusted-preview-url.txt'), 'utf8').trim();
            if (!/^https:\/\/[a-z0-9-]+\.vercel\.app\/?$/i.test(url)) {
              throw new Error('Unexpected preview URL; no comment was posted.');
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `默认分支演示预览（不是本 PR 代码的构建）：\n\n${url}\n\n源码提交：${context.sha}`,
            });
